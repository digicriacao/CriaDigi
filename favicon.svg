<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .halo { transform-origin: 32px 32px; animation: halo 2.4s ease-out infinite; }
    .bola { transform-origin: 32px 32px; animation: bola 2.4s ease-in-out infinite; }
    @keyframes halo { 0% { transform: scale(.55); opacity: .55 } 100% { transform: scale(1); opacity: 0 } }
    @keyframes bola { 0%, 100% { transform: scale(1) } 50% { transform: scale(.88) } }
  </style>
  <circle class="halo" cx="32" cy="32" r="30" fill="#EA0356"/>
  <circle class="bola" cx="32" cy="32" r="17" fill="#EA0356"/>
</svg>
